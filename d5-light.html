<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>برشلونة · فاتح هادي</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@200;400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="base.css">
<style>
:root{--fg:#14213d;--muted:rgba(20,33,61,.6);--accent:#a50044;--card:rgba(255,255,255,.7);--cardb:rgba(20,33,61,.09);--sheet:#fff;--sheet-fg:#14213d}
.phone{background:#f3efe7;box-shadow:0 0 0 7px #d8d2c6,0 30px 90px rgba(0,0,0,.35)}
.bg{background:repeating-linear-gradient(90deg,rgba(0,77,152,.1) 0 14cqw,rgba(165,0,68,.1) 14cqw 28cqw);-webkit-mask:linear-gradient(180deg,#000,transparent 75%);mask:linear-gradient(180deg,#000,transparent 75%);transform:translateX(calc(var(--px)*-4cqw)) scale(1.1)}
#seconds{color:#a50044}#countdown.live{color:#d6004c}
</style>
</head>
<body>
<div class="phone" data-fx="none" data-colors="#004d98,#a50044">
 <div class="bg"></div><canvas id="fx"></canvas>
 <div class="ui">
  <div class="crest"></div><div class="brand">FC BARCELONA</div>
  <div class="clock"><div id="time">00:00</div><span id="seconds"></span><div id="date"></div></div>
  <div id="hero"><div id="heroLeague"></div><div class="row"><span id="heroHome"></span><span id="heroScore"></span><span id="heroAway"></span></div><div id="countdown"></div></div>
  <div id="matches"></div><div id="note"></div>
 </div>
 <div id="modal"><div class="sheet"><h2 id="modalTitle"></h2><p id="modalSub"></p><div class="hint" id="streamHint"></div><div id="streamList"></div><button id="closeBtn">إغلاق ✕</button></div></div>
</div>
<script src="app.js"></script>
<script src="fx.js"></script>
</body>
</html>
